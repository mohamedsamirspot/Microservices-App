name: ci


# If SonarQube results are a gate to image building, keep your stages ordering.
# If security scanning is a higher priority, consider scanning the image right after building then put the sonarqube check after image scanning.


# ✔ Push events = accepted code → OK to build & scan images
# ❌ PR events = proposed code → run checks only, no publishing
# | Event                                                               | Triggers **Release-Tag Workflow**  | Triggers **CI Workflow** | Notes                                                  |
# | ------------------------------------------------------------------- | ---------------------------------  | ------------------------ | ------------------------------------------------------ |
# | **Push to any non-`main` branch**                                   | ❌ No                              | ✅ Yes                    | Builds & scans branch images → `v1.440.0-branch-name`  |
# | **Push to `main` branch**                                           | ✅ Yes                             | ❌ No                     | Release workflow bumps version & creates tag           |
# | **Pull request into any branch**                                    | ❌ No                              | ⚠️ Yes (CI only)         | Runs tests/scans; **no images pushed**                 |
# | **Merge into `main`**                                               | ✅ Yes                             | ❌ No                     | Release workflow creates Git tag (`vX.Y.Z`)            |
# | **Git tag pushed (vX.Y.Z)**                                         | ❌ No                              | ✅ Yes                    | Builds **production image** → `vX.Y.Z`, `latest`       |
# | **Manual run (workflow_dispatch)**                                  | ❌ No                              | ✅ Yes                    | Optional publish shared `-dev` tag → `v1.440.0-dev`    |
# | **Push to any other branch (feature/* etc.)**                       | ❌ No                              | ✅ Yes                    | Builds & scans branch images; publishing stays opt-in  |
# | **Automatic tag created by release workflow "only in main branch"** | (This workflow creates it)          | ✅ Yes                    | CI runs on tags created by release workflow            |


on:
  workflow_call:
    inputs:
      tag:
        description: "Semantic version tag created by the release workflow"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      publish_dev_image:
        description: "Push the branch build as the shared -dev image tag"
        required: false
        default: false
        type: boolean
  # Direct pushes to main do not run this workflow from the push trigger.
  # Main goes through release-tag-then-call-ci.yml, which creates the release tag
  # and then calls this workflow directly as a reusable workflow.
  push:
    branches-ignore: [ main ]
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ci-group
  # the default is wait
  cancel-in-progress: false

env:
  IMAGE_NAME: mohamedsamirebrahim/microservices-python-image

jobs:
  #SCA: Strengthen with Snyk or pip-audit if you can: Trivy FS is good but adding a Python-specific tool catches more
  sca-trivy-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Scans your project configuration files (like terraform, dockerfile, k8s manifests) (optional but useful).
      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          format: table
          output: trivy-config.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: table
          output: trivy-fs.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-setup-trivy: true
      - name: Publish Trivy SCA Summary
        if: always()
        shell: bash
        run: |
          publish_report() {
            local title="$1"
            local report_file="$2"

            if [ -s "$report_file" ]; then
              {
                echo "### $title"
                echo "<details><summary>Click to expand</summary>"
                echo ""
                echo '```text'
                cat "$report_file"
                echo '```'
                echo "</details>"
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          publish_report "Trivy Config Scan" trivy-config.txt
          publish_report "Trivy FS Scan" trivy-fs.txt

  #SAST: Add Bandit (Python-specific) if you can: SonarQube is broad; Bandit is purpose-built for Python security issues (SQL injection, hardcoded secrets, unsafe deserialization, etc.):
  # sast-sonarqube-check:
  #   runs-on: ubuntu-latest
  #   needs: sca-trivy-dependency-check
  #   continue-on-error: true
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: SonarQube Scan
  #       uses: SonarSource/sonarqube-scan-action@v8
  #       with:
  #         args: >
  #           -Dsonar.projectKey=microservices
  #           -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
  #           -Dsonar.login=${{ secrets.SONAR_TOKEN }}
  #           -Dsonar.qualitygate.wait=false
  #           -Dsonar.exclusions=**/dependency-check-report.html

  #SAST
  sast-semgrep-check:
    runs-on: ubuntu-latest
    needs: sca-trivy-dependency-check
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Semgrep Scan
        uses: mohamedsamirspot/Microservices-Github-Actions/.github/actions/sast-semgrep@main

  #SCA
  build-and-trivy-scan-container-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
    needs:
      # - sast-sonarqube-check
      - sast-semgrep-check
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Determine Docker image tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            # Release triggered by release-tag workflow → semantic tag
            tag="${{ inputs.tag }}"
          else
            git fetch --force --tags origin

            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
            if [ -z "$latest_tag" ]; then
              latest_tag="v0.0.0"
            fi

            base_version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$base_version"

            minor=$((minor + 1))
            patch=0

            # Extract and sanitize branch name for use in tag
            branch_name="${GITHUB_REF##*/}"
            branch_name="${branch_name//[^a-zA-Z0-9._-]/-}"

            tag="v${major}.${minor}.${patch}-${branch_name}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ steps.version.outputs.tag }} .
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          scan-type: image
          format: table
          output: trivy-image.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Publish Trivy Image Summary
        if: always()
        shell: bash
        run: |
          if [ -s trivy-image.txt ]; then
            {
              echo "### Trivy Image Scan"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```text'
              cat trivy-image.txt
              echo '```'
              echo "</details>"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save image
        run: docker save $IMAGE_NAME:${{ steps.version.outputs.tag }} -o image.tar
      - name: Upload TAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  #DAST (it is better to put this job to be after the deployment pipeline but for demo purposes we will run it here right after image build and scan, before pushing to registry. In real life, you would want to deploy the image to a staging environment and run DAST against that environment instead of running it against a local container in the CI runner):
  dast-zap:
      runs-on: ubuntu-latest
      needs: build-and-trivy-scan-container-image
      if: github.event_name != 'pull_request'
      steps:
        - name: Checkout
          uses: actions/checkout@v7
        - name: Download image TAR
          uses: actions/download-artifact@v8
          with:
            name: docker-image
        - name: Load image
          run: docker load -i image.tar
        - name: Run Flask app
          run: |
            docker run -d --name flask-app -p 5000:5000 \
              ${{ env.IMAGE_NAME }}:${{ needs.build-and-trivy-scan-container-image.outputs.image_tag }}
            sleep 10
        - name: Wait for Flask app to be ready
          run: |
            for i in {1..10}; do
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/products | grep -q "200"; then
                echo "App is ready"
                break
              fi
              echo "Waiting... attempt $i"
              sleep 3
            done
        - name: Fix workspace permissions for ZAP
          run: chmod a+w ${{ github.workspace }}
        - name: Run ZAP Scan on /products
          uses: zaproxy/action-baseline@v0.15.0
          continue-on-error: true
          with:
            target: 'http://localhost:5000/products'
            fail_action: false
            allow_issue_writing: false # disables auto issue creation
            artifact_name: ''
        # - name: Fix workspace permissions for ZAP (second scan)
        #   run: chmod a+w ${{ github.workspace }}
        # - name: Run ZAP Scan on /users
        #   uses: zaproxy/action-baseline@v0.12.0
        #   continue-on-error: true
        #   with:
        #     target: 'http://localhost:5000/users'
        #     fail_action: false
        #     allow_issue_writing: false # disables auto issue creation
        #     artifact_name: ''
        - name: Stop Flask app
          if: always()
          run: docker stop flask-app && docker rm flask-app

  push-container-image:
    if: inputs.tag != '' || (github.event_name == 'workflow_dispatch' && inputs.publish_dev_image)
    runs-on: ubuntu-latest
    needs:
      - build-and-trivy-scan-container-image
      - dast-zap
    steps:
      - name: Download image TAR
        uses: actions/download-artifact@v8
        with:
          name: docker-image
      - name: Load image
        run: docker load -i image.tar
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Push image
        run: |
          docker push $IMAGE_NAME:${{ needs.build-and-trivy-scan-container-image.outputs.image_tag }}

